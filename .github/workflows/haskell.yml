name: CI
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
env:
  CONFIG: "--enable-tests --enable-benchmarks "
jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        ghc: ["8.10.4", "9.0.2", "9.2.4", "9.4.2"]
        experimental: [false]
          #         include:
          #           - ghc: "head"
          #             experimental: true
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      - uses: haskell/actions/setup@a4ad32dbde5324e3c4ebed7d8e4cd8b94c3ed28e # v1.2.12
        id: setup-haskell-cabal
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}
      - run: cabal v2-update
      - run: cabal v2-freeze $CONFIG
      - uses: actions/cache@8492260343ad570701412c2f464a5877dc76bace # v2
        with:
          path: |
            ${{ steps.setup-haskell-cabal.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('cabal.project.freeze') }}
            ${{ runner.os }}-${{ matrix.ghc }}-
      - run: cabal v2-build --disable-optimization -j $CONFIG
        continue-on-error: ${{ matrix.experimental }}
      - run: cabal v2-test --disable-optimization -j $CONFIG --test-options "--fail-on-focus"
        continue-on-error: ${{ matrix.experimental }}
      - if: ${{ matrix.ghc != '8.6.5' }}
        continue-on-error: ${{ matrix.experimental }}
        run: cabal v2-haddock -j $CONFIG
      - run: cabal v2-sdist
        continue-on-error: ${{ matrix.experimental }}
