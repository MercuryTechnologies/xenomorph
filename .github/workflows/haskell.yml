name: CI
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
env:
  CONFIG: "--enable-tests --enable-benchmarks "
jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        ghc: ["8.10.4", "9.0.2", "9.2.4", "9.4.2"]
        experimental: [false]
          #         include:
          #           - ghc: "head"
          #             experimental: true
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: haskell/actions/setup@a4ad32dbde5324e3c4ebed7d8e4cd8b94c3ed28e # v1
        id: setup-haskell-cabal
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}
      - run: cabal v2-update
      - run: cabal v2-freeze $CONFIG
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.setup-haskell-cabal.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('cabal.project.freeze') }}
            ${{ runner.os }}-${{ matrix.ghc }}-
      - run: cabal v2-build --disable-optimization -j $CONFIG
        continue-on-error: ${{ matrix.experimental }}
      - run: cabal v2-test --disable-optimization -j $CONFIG --test-options "--fail-on-focus"
        continue-on-error: ${{ matrix.experimental }}
      - if: ${{ matrix.ghc != '8.6.5' }}
        continue-on-error: ${{ matrix.experimental }}
        run: cabal v2-haddock -j $CONFIG
      - run: cabal v2-sdist
        continue-on-error: ${{ matrix.experimental }}
